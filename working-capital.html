<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GK ADVISORY - Çalışma Sermayesi Yönetimi</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="gk-header">
    <div class="gk-header-container">
      <div class="gk-brand">
        <span class="brand-logo">GK</span>
        <span class="brand-title">ADVISORY</span>
      </div>
      <nav class="gk-nav">
        <a href="dashboard.html" class="nav-link">← Panele Dön</a>
      </nav>
    </div>
  </header>

  <main class="main-container">
    <div class="page-header">
      <div class="kpi-title">FINANCE INTELLIGENCE · WORKING CAPITAL</div>
      <h1>Çalışma Sermayesi Yönetimi</h1>
      <p>Nakit Dönüşüm Süresi (CCC), Alacak Tahsilat Süresi (DSO), Stok Devir Süresi (DIO) ve Borç Ödeme Süresi (DPO) analizi.</p>
    </div>

    <div class="kpi-card">
      <h3 class="serif-title" style="font-size: 1.2rem; color: var(--gk-navy); margin-bottom: 16px;">1 · Çalışma Sermayesi Girdileri</h3>
      <form style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px;">
        <div>
          <label class="kpi-title">ALACAKLAR (DSO HESABI)</label>
          <input type="number" placeholder="Örn. 1200000" style="width: 100%; padding: 10px; border: 1px solid var(--card-border); background: #fff; border-radius: 4px; margin-top: 4px;">
        </div>
        <div>
          <label class="kpi-title">STOKLAR (DIO HESABI)</label>
          <input type="number" placeholder="Örn. 850000" style="width: 100%; padding: 10px; border: 1px solid var(--card-border); background: #fff; border-radius: 4px; margin-top: 4px;">
        </div>
        <div>
          <label class="kpi-title">BORÇLAR (DPO HESABI)</label>
          <input type="number" placeholder="Örn. 650000" style="width: 100%; padding: 10px; border: 1px solid var(--card-border); background: #fff; border-radius: 4px; margin-top: 4px;">
        </div>
      </form>
    </div>
  </main>

  <script src="js/financial-data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
