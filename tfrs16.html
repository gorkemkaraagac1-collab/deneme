<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>LeaseQant — Çalışma Alanı</title>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var aliases = {
        contracts: 'contracts', close: 'close', accountingCenter: 'journals',
        financialReporting: 'calculations', footnotes: 'disclosures', riskControls: 'close'
      };
      if (!params.has('view') && aliases[params.get('open')]) params.set('view', aliases[params.get('open')]);
      params.delete('open'); params.delete('ui');
      var query = params.toString();
      window.location.replace('workspace.html' + (query ? '?' + query : '') + window.location.hash);
    })();
  </script>
</head>
<body>
  <p>LeaseQant yeni çalışma alanına yönlendiriliyor…</p>
  <p>Yönlendirme başlamazsa <a href="workspace.html">çalışma alanını açın</a>.</p>
</body>
</html>
