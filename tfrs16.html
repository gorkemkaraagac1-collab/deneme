<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GK ADVISORY - TFRS 16 Kiralama Muhasebesi</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="gk-header">
    <div class="gk-header-container">
      <div class="gk-brand">
        <span class="brand-logo">GK</span>
        <span class="brand-title">ADVISORY</span>
      </div>
      <nav class="gk-nav">
        <a href="dashboard.html" class="nav-link">← Panele Dön</a>
      </nav>
    </div>
  </header>

  <main class="main-container">
    <div class="page-header">
      <div class="kpi-title">FINANCE INTELLIGENCE · TFRS 16 / IFRS 16</div>
      <h1>TFRS 16 Kiralama Muhasebesi</h1>
      <p>Kullanım hakkı varlığı (RoU) ve kiralama borçları itfa tablosu hesaplama motoru.</p>
    </div>

    <div class="kpi-card">
      <h3 class="serif-title" style="font-size: 1.2rem; color: var(--gk-navy); margin-bottom: 16px;">1 · Sözleşme Bilgileri</h3>
      <form style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px;">
        <div>
          <label class="kpi-title">AYLIK KİRA TUTARI</label>
          <input type="number" placeholder="Örn. 50000" style="width: 100%; padding: 10px; border: 1px solid var(--card-border); background: #fff; border-radius: 4px; margin-top: 4px;">
        </div>
        <div>
          <label class="kpi-title">ALTERNATİF BORÇLANMA ORANI (%)</label>
          <input type="number" step="0.01" placeholder="Örn. 24.5" style="width: 100%; padding: 10px; border: 1px solid var(--card-border); background: #fff; border-radius: 4px; margin-top: 4px;">
        </div>
        <div>
          <label class="kpi-title">KİRALAMA SÜRESİ (AY)</label>
          <input type="number" placeholder="Örn. 36" style="width: 100%; padding: 10px; border: 1px solid var(--card-border); background: #fff; border-radius: 4px; margin-top: 4px;">
        </div>
      </form>
    </div>
  </main>

  <script src="js/financial-data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
