<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Araç — GK Advisory</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--ink:#0F1C2E;--parchment:#EDEAE2;--paper:#F7F5F0;--brass:#B08D57;--brass-dark:#8C6D3F;--line:rgba(176,141,87,0.35);--text-mute:#5B6472;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--paper);color:#1C2A3A;font-family:'Inter',sans-serif;line-height:1.6;}
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:900px;margin:0 auto;padding:0 32px;}
  header{background:var(--ink);border-bottom:1px solid var(--line);}
  .nav{display:flex;align-items:center;justify-content:space-between;padding:20px 32px;max-width:1120px;margin:0 auto;}
  .wordmark{color:var(--parchment);font-family:'Fraunces',serif;font-weight:600;font-size:19px;}
  .wordmark span{color:var(--brass);}
  .nav a.back{color:rgba(237,234,226,0.7);font-size:13.5px;}
  .tool-hero{background:var(--ink);padding:56px 0;}
  .eyebrow{color:var(--brass);font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:14px;}
  .tool-hero h1{font-family:'Fraunces',serif;font-weight:500;font-size:clamp(26px,3.4vw,36px);color:var(--parchment);}
  .stub{padding:70px 0;text-align:center;border:1px dashed var(--line);margin:56px auto;max-width:600px;border-radius:2px;background:var(--parchment);}
  .stub p{color:var(--text-mute);font-size:14.5px;margin-top:10px;}
</style>
</head>
<body>
<header><nav class="nav"><div class="wordmark">GK <span>ADVISORY</span></div><a href="dashboard.html" class="back">← Panele dön</a></nav></header>
<section class="tool-hero"><div class="wrap"><div class="eyebrow" id="toolTag">Lisanslı Araç</div><h1 id="toolTitle">Araç Yükleniyor…</h1></div></section>
<div class="wrap"><div class="stub"><div class="eyebrow" style="margin-bottom:0;">Yapım Aşamasında</div><p>Bu aracın hesaplama motoru henüz geliştirilmedi. Backend ve lisans kontrolü tamamlandığında, buraya gerçek araç yerleştirilecek.</p></div></div>
<script src="auth.js"></script>
<script>
  const names = { sap:'SAP S/4HANA FI-CO Danışmanlığı', tfrs16:'TFRS 16 Kiralama İşlemleri Yazılımı', ecl:'ECL Analyzer', hedge:'Hedge Accounting Modülü', dcf:'DCF Değerleme Aracı', tms29:'TMS 29 Endeksleme', workingcapital:'Working Capital Analyzer' };
  const id = new URLSearchParams(location.search).get('service');
  document.getElementById('toolTitle').textContent = names[id] || 'Araç Bulunamadı';
  const user = window.GKAuth ? window.GKAuth.current() : null;
  if(!user){ location.href = 'login.html?next=' + encodeURIComponent(location.pathname + location.search); }
</script>
</body>
</html>
