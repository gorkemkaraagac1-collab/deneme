<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Üye Girişi — GK Advisory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0F1C2E; --ink-2:#16283F; --parchment:#EDEAE2; --paper:#F7F5F0;
    --brass:#B08D57; --brass-dark:#8C6D3F; --line:rgba(176,141,87,0.35);
    --text-dark:#1C2A3A; --text-mute:#5B6472;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--ink); color:var(--parchment); font-family:'Inter',sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
    background:radial-gradient(ellipse at 80% 0%, rgba(176,141,87,0.10), transparent 55%), var(--ink);
  }
  a{color:inherit; text-decoration:none;}
  .card{
    width:100%; max-width:400px; background:var(--ink-2); border:1px solid var(--line);
    border-radius:2px; padding:40px 36px;
  }
  .wordmark{
    font-family:'Fraunces',serif; font-weight:600; font-size:19px; text-align:center; margin-bottom:6px;
  }
  .wordmark span{color:var(--brass);}
  .sub{
    text-align:center; font-family:'JetBrains Mono',monospace; font-size:11.5px;
    letter-spacing:0.1em; text-transform:uppercase; color:rgba(237,234,226,0.5); margin-bottom:32px;
  }
  .field{margin-bottom:16px;}
  .field label{
    display:block; font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.06em;
    text-transform:uppercase; color:var(--brass); margin-bottom:7px;
  }
  .field input{
    width:100%; border:1px solid rgba(237,234,226,0.15); background:rgba(237,234,226,0.04);
    color:var(--parchment); padding:12px 13px; font-size:14.5px; border-radius:2px; font-family:'Inter',sans-serif;
  }
  .field input:focus{outline:1px solid var(--brass); border-color:var(--brass);}
  .btn{
    width:100%; background:var(--brass); color:var(--ink); padding:13px; font-size:14px; font-weight:600;
    border:none; border-radius:2px; cursor:pointer; margin-top:8px; font-family:'Inter',sans-serif;
  }
  .btn:hover{background:#c39c66;}
  .note{
    margin-top:22px; font-size:12.5px; color:rgba(237,234,226,0.5); line-height:1.6;
    border-top:1px solid rgba(237,234,226,0.1); padding-top:18px;
  }
  .note strong{color:var(--brass);}
  .back{
    display:block; text-align:center; margin-top:24px; font-family:'JetBrains Mono',monospace;
    font-size:12.5px; color:rgba(237,234,226,0.5);
  }
  .back:hover{color:var(--brass);}
</style>
</head>
<body>

  <div class="card">
    <div class="wordmark">GK <span>ADVISORY</span></div>
    <div class="sub">Üye Girişi</div>

    <form id="loginForm">
      <div class="field">
        <label>E-posta</label>
        <input type="email" id="email" placeholder="ornek@sirket.com" required>
      </div>
      <div class="field">
        <label>Şifre</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <button class="btn" type="submit">Giriş Yap</button>
    </form>

    <div class="note">
      <strong>Not:</strong> Bu bir tasarım taslağıdır — herhangi bir e-posta/şifre ile "demo üye" olarak panele girebilirsiniz. Gerçek kimlik doğrulama backend bağlandığında etkinleşecek.
    </div>

    <a href="index.html" class="back">← Ana sayfaya dön</a>
  </div>

<script>
  document.getElementById('loginForm').addEventListener('submit', e => {
    e.preventDefault();
    window.location.href = 'dashboard.html';
  });
</script>

</body>
</html>
