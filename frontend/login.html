<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Financial Intelligence Platform</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #f5f7fa;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }
    .login-container {
        background: #fff;
        padding: 40px;
        border-radius: 8px;
        box-shadow: 0 4px 24px rgba(0,0,0,0.08);
        width: 100%;
        max-width: 400px;
    }
    .login-container h1 {
        font-size: 24px;
        font-weight: 600;
        margin-bottom: 8px;
        text-align: center;
    }
    .login-container .subtitle {
        text-align: center;
        color: #7f8c8d;
        margin-bottom: 24px;
        font-size: 14px;
    }
    .form-group {
        margin-bottom: 16px;
    }
    .form-group label {
        display: block;
        font-weight: 500;
        font-size: 14px;
        margin-bottom: 4px;
    }
    .form-group input {
        width: 100%;
        padding: 10px 14px;
        border: 1px solid #e1e8ed;
        border-radius: 6px;
        font-size: 14px;
        transition: border-color 0.2s;
    }
    .form-group input:focus {
        outline: none;
        border-color: #3498db;
    }
    .btn-login {
        width: 100%;
        padding: 12px;
        background: #3498db;
        color: #fff;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.2s;
    }
    .btn-login:hover {
        background: #2980b9;
    }
    .btn-login:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }
    .error-msg {
        background: #fadbd8;
        color: #922b21;
        padding: 12px;
        border-radius: 6px;
        margin-bottom: 16px;
        display: none;
        font-size: 14px;
    }
    .footer {
        text-align: center;
        margin-top: 16px;
        font-size: 12px;
        color: #7f8c8d;
    }
</style>
</head>
<body>
<div class="login-container">
    <h1>Financial Intelligence</h1>
    <p class="subtitle">
        Platform Login
    </p>
    <div id="errorMsg" class="error-msg"></div>
    <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                placeholder="Enter your username"
                autocomplete="username"
                required
            >
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >
        </div>
        <button
            type="submit"
            class="btn-login"
            id="loginBtn"
        >
            Login
        </button>
    </form>
    <div class="footer">
        Financial Intelligence Platform v1.0
    </div>
</div>
<script>
/*
 * ============================================================
 * API CONFIGURATION
 * ============================================================
 *
 * Frontend GitHub Pages üzerinde çalışıyor.
 * Backend Cloud Run üzerinde çalışıyor.
 *
 * Bu nedenle relative "/api/..." kullanılamaz.
 */
const API_BASE_URL =
    "https://deneme-git-285469227510.europe-west1.run.app";
/*
 * ============================================================
 * LOGIN
 * ============================================================
 */
async function handleLogin(event) {
    event.preventDefault();
    const username =
        document.getElementById("username").value.trim();
    const password =
        document.getElementById("password").value;
    const btn =
        document.getElementById("loginBtn");
    const errorEl =
        document.getElementById("errorMsg");
    if (!username || !password) {
        errorEl.textContent =
            "Please enter username and password.";
        errorEl.style.display = "block";
        return;
    }
    errorEl.style.display = "none";
    btn.disabled = true;
    btn.textContent = "Logging in...";
    try {
        /*
         * ----------------------------------------------------
         * LOGIN REQUEST
         * ----------------------------------------------------
         */
        const response = await fetch(
            `${API_BASE_URL}/api/auth/login`,
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    username,
                    password
                })
            }
        );
        /*
         * ----------------------------------------------------
         * RESPONSE
         * ----------------------------------------------------
         */
        const result =
            await response.json();
        /*
         * Backend gerçek response formatı:
         *
         * {
         *   token: "...",
         *   user: {
         *      id,
         *      username,
         *      role,
         *      ...
         *   }
         * }
         *
         * success/data wrapper YOK.
         */
        if (
            response.ok &&
            result.token &&
            result.user
        ) {
            /*
             * ------------------------------------------------
             * TOKEN
             * ------------------------------------------------
             */
            localStorage.setItem(
                "access_token",
                result.token
            );
            /*
             * Kullanıcı bilgilerini de sakla.
             */
            localStorage.setItem(
                "current_user",
                JSON.stringify(result.user)
            );
            /*
             * ------------------------------------------------
             * P1-D — MUST CHANGE PASSWORD
             * ------------------------------------------------
             * DÜZELTME: bu akış önceden burada HİÇ kontrol
             * edilmiyordu — backend zaten requireAuth seviyesinde
             * mustChangePassword=true olan kullanıcıyı GET /me ve
             * POST /change-password dışındaki HER ŞEYDEN 403
             * (MUST_CHANGE_PASSWORD) ile engelliyordu, ama frontend
             * yine de normal dashboard'a yönlendiriyordu — kullanıcı
             * "her tıklamada 403 alan" bozuk bir ekranla
             * karşılaşıyordu. Artık mustChangePassword=true ise
             * hangi rol olursa olsun doğrudan parola değiştirme
             * ekranına yönlendiriliyor.
             */
            if (result.user.mustChangePassword) {
                window.location.href =
                    "./admin/change-password.html";
                return;
            }
            /*
             * ------------------------------------------------
             * STAFF (ADMIN / ACCOUNTANT_MANAGER)
             * ------------------------------------------------
             * DÜZELTME: ACCOUNTANT_MANAGER önceden ADMIN ile aynı
             * satırda kontrol edilmediği için müşteri dashboard'una
             * (./dashboard.html) düşüyordu — hâlbuki backend P1'de
             * bu role users/companies admin API'lerine erişim
             * (requireStaffAccess) veriyor. Admin paneli artık
             * ACCOUNTANT_MANAGER'ı da kabul ediyor (bkz. admin.js
             * checkAdminAuth) ve ADMIN-only sayfa/aksiyonları kendi
             * içinde gizliyor.
             */
            if (result.user.role === "ADMIN") {
                window.location.href =
                    "./admin/index.html";
                return;
            }
            if (result.user.role === "ACCOUNTANT_MANAGER") {
                /*
                 * admin/index.html (Dashboard) backend'de requireAdmin
                 * (ADMIN-only) ile korunuyor — ACCOUNTANT_MANAGER'ı
                 * oraya gönderip sonra users.html'e sektirmek yerine
                 * doğrudan erişebildiği sayfaya yönlendiriyoruz.
                 */
                window.location.href =
                    "./admin/users.html";
                return;
            }
            /*
             * ------------------------------------------------
             * CUSTOMER
             * ------------------------------------------------
             */
            window.location.href =
                "./dashboard.html";
            return;
        }
        /*
         * ----------------------------------------------------
         * LOGIN FAILED
         * ----------------------------------------------------
         */
        errorEl.textContent =
            result.error ||
            "Login failed. Please check your credentials.";
        errorEl.style.display = "block";
        btn.disabled = false;
        btn.textContent = "Login";
    } catch (error) {
        console.error(
            "Login error:",
            error
        );
        errorEl.textContent =
            "Backend connection failed. Please try again.";
        errorEl.style.display = "block";
        btn.disabled = false;
        btn.textContent = "Login";
    }
}
</script>
</body>
</html>
