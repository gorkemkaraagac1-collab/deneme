<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Companies - Admin Panel</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            Financial Intelligence
            <small>Platform Admin</small>
        </div>
        <div class="sidebar-nav">
            <div class="nav-label">Yönetim</div>
            <a href="index.html">📊 Dashboard</a>
            <a href="companies.html" class="active">🏢 Companies</a>
            <a href="users.html">👤 Users</a>
            <a href="licenses.html">🔑 Licenses</a>
            <a href="../../tfrs16.html" target="_blank">🧮 TFRS16 Hesaplama Motoru</a>
            <a href="tfrs16.html">🧾 TFRS16 Customers</a>
            <a href="audit.html">📋 Audit Log</a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main-content">
        <header class="top-header">
            <div class="page-title">Companies</div>
            <div class="user-info">
                <span class="username" id="adminUsername">Loading...</span>
                <span class="role-badge">ADMIN</span>
                <button class="btn-logout" onclick="logout()">Logout</button>
            </div>
        </header>

        <div class="page-content">
            <div class="table-container">
                <div class="table-header">
                    <h3>All Companies</h3>
                    <button class="btn btn-primary" onclick="showCreateCompanyModal()">+ New Company</button>
                </div>
                <div class="table-toolbar">
                    <input type="text" id="companySearchInput" placeholder="Search by name or code..." oninput="onCompanySearchInput()">
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Code</th>
                            <th>Name</th>
                            <th>Status</th>
                            <th>Users</th>
                            <th>Plan</th>
                            <th>License Status</th>
                            <th>Expiry</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="companiesTableBody">
                        <tr><td colspan="8" style="text-align:center;color:var(--text-light);">Loading...</td></tr>
                    </tbody>
                </table>
                <div id="companiesPagination"></div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Create Company</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="../js/admin.js"></script>
    <script>
        let allPlans = [];

        async function loadPlans() {
            try {
                const result = await AdminAPI.getPlans();
                if (result.success) {
                    allPlans = result.data;
                }
            } catch (error) {
                console.error('Load plans error:', error);
            }
        }

        // Assign-license modal dropdown dosyanın kalanından bağımsız,
        // sayfalanmamış tam şirket listesine ihtiyaç duyar — companiesCache
        // artık sayfalı (bkz. loadCompanies), o yüzden burada ayrı bir
        // yüksek-limitli çağrı kullanılır.
        let allCompaniesForAssign = [];
        async function loadAllCompaniesForAssign() {
            try {
                const result = await AdminAPI.getCompanies({ limit: 500 });
                if (result.success) {
                    allCompaniesForAssign = result.data;
                }
            } catch (error) {
                console.error('Load companies (assign) error:', error);
            }
        }

        function openAssignModal(preselectedCompanyId) {
            showAssignLicenseModal(allCompaniesForAssign, allPlans, preselectedCompanyId, loadCompanies);
        }

        let companiesCache = [];
        let companiesState = { search: '', limit: 20, offset: 0 };

        function onCompanySearchInput() {
            debouncedCompanySearch();
        }

        const debouncedCompanySearch = debounce(() => {
            companiesState.search = document.getElementById('companySearchInput').value.trim();
            companiesState.offset = 0;
            loadCompanies();
        }, 350);

        function changeCompaniesPage(newOffset) {
            companiesState.offset = newOffset;
            loadCompanies();
        }

        async function loadCompanies() {
            try {
                const params = { limit: companiesState.limit, offset: companiesState.offset };
                if (companiesState.search) params.search = companiesState.search;

                const result = await AdminAPI.getCompanies(params);
                if (!result.success) {
                    document.getElementById('companiesTableBody').innerHTML = 
                        `<tr><td colspan="8" style="text-align:center;color:var(--danger);">Error: ${result.error}</td></tr>`;
                    return;
                }
                
                companiesCache = result.data;

                const html = result.data.map(c => `
                    <tr>
                        <td><strong>${escapeHtml(c.code)}</strong></td>
                        <td>${escapeHtml(c.name)}</td>
                        <td>${getStatusBadge(c.status || 'ACTIVE')}</td>
                        <td>${c.user_count || 0}</td>
                        <td>${c.active_license ? escapeHtml(c.active_license.plan_name) : '-'}</td>
                        <td>${c.active_license ? getStatusBadge(c.active_license.status) : getStatusBadge('INACTIVE')}</td>
                        <td>${c.active_license ? formatDateShort(c.active_license.expires_at) : '-'}</td>
                        <td>
                            <button class="btn btn-sm btn-outline" onclick="viewCompany('${c.id}')">View</button>
                            <button class="btn btn-sm btn-primary" onclick="openAssignModal('${c.id}')">License</button>
                            ${(c.status || 'ACTIVE') === 'ACTIVE'
                                ? `<button class="btn btn-sm btn-danger" onclick="toggleCompanyStatus('${c.id}', 'INACTIVE')">Deactivate</button>`
                                : `<button class="btn btn-sm btn-success" onclick="toggleCompanyStatus('${c.id}', 'ACTIVE')">Activate</button>`}
                        </td>
                    </tr>
                `).join('');
                
                document.getElementById('companiesTableBody').innerHTML = html || 
                    `<tr><td colspan="8" style="text-align:center;color:var(--text-light);">No companies found</td></tr>`;

                document.getElementById('companiesPagination').innerHTML =
                    renderPagination(result.pagination, changeCompaniesPage);
                    
            } catch (error) {
                console.error('Load companies error:', error);
            }
        }

        async function toggleCompanyStatus(id, newStatus) {
            const verb = newStatus === 'INACTIVE' ? 'deactivate' : 'activate';
            if (!confirm(`Are you sure you want to ${verb} this company? ${newStatus === 'INACTIVE' ? 'Its users will immediately lose access.' : ''}`)) return;

            try {
                const result = await AdminAPI.updateCompanyStatus(id, newStatus);
                if (result.success) {
                    loadCompanies();
                } else {
                    alert('Error: ' + result.error);
                }
            } catch (error) {
                alert('Error updating company status: ' + error.message);
            }
        }

        function showCreateCompanyModal() {
            const content = `
                <form id="createCompanyForm" onsubmit="createCompany(event)">
                    <div class="form-group">
                        <label>Company Code *</label>
                        <input type="text" name="code" required placeholder="e.g. ABC001">
                    </div>
                    <div class="form-group">
                        <label>Company Name *</label>
                        <input type="text" name="name" required placeholder="e.g. ABC Energy A.S.">
                    </div>
                    <div class="form-group">
                        <label>Tax Number</label>
                        <input type="text" name="tax_number" placeholder="e.g. 1234567890">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" name="email" placeholder="info@company.com">
                    </div>
                    <div class="form-group">
                        <label>Phone</label>
                        <input type="text" name="phone" placeholder="+90 212 555 0000">
                    </div>
                    <div class="form-group">
                        <label>Address</label>
                        <textarea name="address" rows="2" placeholder="Company address"></textarea>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
                        <button type="submit" class="btn btn-primary">Create Company</button>
                    </div>
                </form>
            `;
            showModal('Create Company', content);
        }

        async function createCompany(event) {
            event.preventDefault();
            const form = event.target;
            const data = {
                code: form.code.value.trim(),
                name: form.name.value.trim(),
                tax_number: form.tax_number.value.trim() || null,
                email: form.email.value.trim() || null,
                phone: form.phone.value.trim() || null,
                address: form.address.value.trim() || null
            };
            
            try {
                const result = await AdminAPI.createCompany(data);
                if (result.success) {
                    closeModal();
                    loadCompanies();
                } else {
                    alert('Error: ' + result.error);
                }
            } catch (error) {
                alert('Error creating company: ' + error.message);
            }
        }

        async function viewCompany(id) {
            try {
                const result = await AdminAPI.getCompany(id);
                if (!result.success) {
                    alert('Error: ' + result.error);
                    return;
                }
                
                const c = result.data;
                const summary = c.contracts_summary || { active_count: 0, total_count: 0, suppliers: [], total_monthly_payment_by_currency: [] };
                const totals = (summary.total_monthly_payment_by_currency || [])
                    .map(t => `${Number(t.total).toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} ${t.currency}`)
                    .join(', ') || '-';

                const content = `
                    <div style="margin-bottom:16px;">
                        <p><strong>Code:</strong> ${escapeHtml(c.code)}</p>
                        <p><strong>Name:</strong> ${escapeHtml(c.name)}</p>
                        <p><strong>Status:</strong> ${getStatusBadge(c.status || 'ACTIVE')}</p>
                        <p><strong>Tax Number:</strong> ${escapeHtml(c.tax_number || '-')}</p>
                        <p><strong>Email:</strong> ${escapeHtml(c.email || '-')}</p>
                        <p><strong>Phone:</strong> ${escapeHtml(c.phone || '-')}</p>
                        <p><strong>Address:</strong> ${escapeHtml(c.address || '-')}</p>
                        <p><strong>Created:</strong> ${formatDate(c.created_at)}</p>
                    </div>
                    <hr style="border-color:var(--border);margin:16px 0;">
                    <h4>Users (${c.users ? c.users.length : 0})</h4>
                    <ul style="margin:8px 0 16px 20px;font-size:14px;">
                        ${(c.users || []).map(u => `<li>${escapeHtml(u.username)} - ${u.role} (${u.status})</li>`).join('')}
                    </ul>
                    <h4>Licenses</h4>
                    <ul style="margin:8px 0 16px 20px;font-size:14px;">
                        ${(c.licenses || []).map(l => `<li>${escapeHtml(l.plan_name)} - ${l.status} (${formatDateShort(l.expires_at)})</li>`).join('')}
                    </ul>
                    <h4>TFRS16 Contracts</h4>
                    <p style="margin:8px 0;font-size:14px;">
                        ${summary.active_count} active / ${summary.total_count} total contract(s)<br>
                        Suppliers: ${(summary.suppliers || []).map(escapeHtml).join(', ') || '-'}<br>
                        Total monthly payment: ${totals}
                    </p>
                `;
                showModal(`Company: ${c.name}`, content);
                
            } catch (error) {
                alert('Error loading company: ' + error.message);
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const authenticated = await checkAdminAuth();
            if (authenticated) {
                await Promise.all([loadPlans(), loadAllCompaniesForAssign()]);
                loadCompanies();
            }
        });
    </script>
</body>
</html>
