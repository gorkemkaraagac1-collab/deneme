<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Licenses - Admin Panel</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            Financial Intelligence
            <small>Platform Admin</small>
        </div>
        <div class="sidebar-nav">
            <div class="nav-label">Yönetim</div>
            <a href="index.html">📊 Dashboard</a>
            <a href="companies.html">🏢 Companies</a>
            <a href="users.html">👤 Users</a>
            <a href="licenses.html" class="active">🔑 Licenses</a>
            <a href="plans.html">📦 Plans</a>
            <a href="../../tfrs16.html" target="_blank">🧮 TFRS16 Hesaplama Motoru</a>
            <a href="tfrs16.html">🧾 TFRS16 Customers</a>
            <a href="audit.html">📋 Audit Log</a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main-content">
        <header class="top-header">
            <div class="page-title">Licenses</div>
            <div class="user-info">
                <span class="username" id="adminUsername">Loading...</span>
                <span class="role-badge">ADMIN</span>
                <button class="btn-logout" onclick="logout()">Logout</button>
            </div>
        </header>

        <div class="page-content">
            <div class="table-container">
                <div class="table-header">
                    <h3>All Licenses</h3>
                    <button class="btn btn-primary" onclick="openAssignModal()">
                        + Assign License
                    </button>
                </div>
                <div class="table-toolbar">
                    <label class="toolbar-label" style="display:flex;align-items:center;gap:8px;">
                        <input type="checkbox" id="expiringOnlyCheckbox" onchange="onExpiringToggle()">
                        Yalnızca süresi yaklaşanları göster (
                        <input type="number" id="expiringDaysInput" value="30" min="1" max="3650" style="width:70px;min-width:70px;" onchange="onExpiringToggle()">
                        gün içinde)
                    </label>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Company</th>
                            <th>Plan</th>
                            <th>Status</th>
                            <th>Users (Current/Max)</th>
                            <th>Starts</th>
                            <th>Expires</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="licensesTableBody">
                        <tr><td colspan="7" style="text-align:center;color:var(--text-light);">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Assign License</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="../js/admin.js"></script>
    <script>
        let allCompanies = [];
        let allPlans = [];

        async function loadCompaniesForSelect() {
            try {
                // Dropdown için tam liste gerekir — sayfalama limitiyle
                // (varsayılan 50) kesilmesin diye yüksek bir limit veriyoruz.
                const result = await AdminAPI.getCompanies({ limit: 500 });
                if (result.success) {
                    allCompanies = result.data;
                }
            } catch (error) {
                console.error('Load companies error:', error);
            }
        }

        async function loadPlans() {
            try {
                const result = await AdminAPI.getPlans();
                if (result.success) {
                    allPlans = result.data;
                }
            } catch (error) {
                console.error('Load plans error:', error);
            }
        }

        function openAssignModal(preselectedCompanyId) {
            showAssignLicenseModal(allCompanies, allPlans, preselectedCompanyId, loadLicenses);
        }

        async function loadLicenses() {
            try {
                const expiringOnly = document.getElementById('expiringOnlyCheckbox').checked;
                const days = document.getElementById('expiringDaysInput').value || 30;

                const result = expiringOnly
                    ? await AdminAPI.getExpiringLicenses(days)
                    : await AdminAPI.getLicenses();

                if (!result.success) {
                    document.getElementById('licensesTableBody').innerHTML = 
                        `<tr><td colspan="7" style="text-align:center;color:var(--danger);">Error: ${result.error}</td></tr>`;
                    return;
                }
                
                const html = result.data.map(l => `
                    <tr>
                        <td><strong>${escapeHtml(l.company_name)}</strong><br><small style="color:var(--text-light);">${escapeHtml(l.company_code)}</small></td>
                        <td>${escapeHtml(l.plan_name)}</td>
                        <td>${getStatusBadge(l.status)}</td>
                        <td>${l.current_users || 0} / ${l.max_users ? l.max_users : '∞'}</td>
                        <td>${formatDateShort(l.starts_at)}</td>
                        <td>${formatDateShort(l.expires_at)}</td>
                        <td>
                            <button class="btn btn-sm btn-success" onclick="extendLicense('${l.id}')">Extend</button>
                            ${l.status === 'ACTIVE' ? 
                                `<button class="btn btn-sm btn-danger" onclick="cancelLicense('${l.id}')">Cancel</button>` : ''}
                        </td>
                    </tr>
                `).join('');
                
                document.getElementById('licensesTableBody').innerHTML = html || 
                    `<tr><td colspan="7" style="text-align:center;color:var(--text-light);">${expiringOnly ? 'No licenses expiring in this range' : 'No licenses found'}</td></tr>`;
                    
            } catch (error) {
                console.error('Load licenses error:', error);
            }
        }

        // DÜZELTME: platform genelinde "önümüzdeki N gün içinde bitecek
        // lisanslar" görünümü yoktu — yenileme takibi elle yapılıyordu.
        // Dashboard'daki "Expiring Licenses (30d)" kutusu buraya
        // ?expiring=30 ile bağlanır ve checkbox'ı otomatik işaretler.
        function onExpiringToggle() {
            loadLicenses();
        }

        function initExpiringFromQuery() {
            const params = new URLSearchParams(window.location.search);
            const expiring = params.get('expiring');
            if (expiring) {
                document.getElementById('expiringOnlyCheckbox').checked = true;
                document.getElementById('expiringDaysInput').value = expiring;
            }
        }

        async function extendLicense(id) {
            const months = prompt('Kaç ay uzatılsın? (1-120)', '12');
            if (!months) return;
            
            const monthsNum = parseInt(months);
            if (isNaN(monthsNum) || monthsNum < 1 || monthsNum > 120) {
                alert('Lütfen 1-120 arası bir değer girin.');
                return;
            }
            
            try {
                const result = await AdminAPI.extendLicense(id, { additionalMonths: monthsNum });
                if (result.success) {
                    alert('License extended successfully!');
                    loadLicenses();
                } else {
                    alert('Error: ' + result.error);
                }
            } catch (error) {
                alert('Error extending license: ' + error.message);
            }
        }

        async function cancelLicense(id) {
            if (!confirm('License iptal edilsin mi?')) return;
            
            try {
                const result = await AdminAPI.cancelLicense(id);
                if (result.success) {
                    alert('License cancelled successfully!');
                    loadLicenses();
                } else {
                    alert('Error: ' + result.error);
                }
            } catch (error) {
                alert('Error cancelling license: ' + error.message);
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const authenticated = await checkAdminAuth();
            if (authenticated) {
                initExpiringFromQuery();
                await Promise.all([loadCompaniesForSelect(), loadPlans()]);
                loadLicenses();
            }
        });
    </script>
</body>
</html>
