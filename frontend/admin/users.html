<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users - Admin Panel</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            Financial Intelligence
            <small>Platform Admin</small>
        </div>
        <div class="sidebar-nav">
            <div class="nav-label">Yönetim</div>
            <a href="index.html" data-admin-only>📊 Dashboard</a>
            <a href="companies.html">🏢 Companies</a>
            <a href="users.html" class="active">👤 Users</a>
            <a href="licenses.html" data-admin-only>🔑 Licenses</a>
            <a href="plans.html" data-admin-only>📦 Plans</a>
            <a href="../../tfrs16.html">🧮 TFRS16 Hesaplama Motoru</a>
            <a href="tfrs16.html" data-admin-only>🧾 TFRS16 Customers</a>
            <a href="inflation-indices.html" data-admin-only>📈 Enflasyon Endeksleri</a>
            <a href="audit.html" data-admin-only>📋 Audit Log</a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main-content">
        <header class="top-header">
            <div class="page-title">Users</div>
            <div class="user-info">
                <span class="username" id="adminUsername">Loading...</span>
                <span class="role-badge">ADMIN</span>
                <button class="btn-logout" onclick="logout()">Logout</button>
            </div>
        </header>

        <div class="page-content">
            <div class="table-container">
                <div class="table-header">
                    <h3>All Users</h3>
                    <button class="btn btn-primary" onclick="showCreateUserModal()">+ New User</button>
                </div>
                <div class="table-toolbar">
                    <input type="text" id="userSearchInput" placeholder="Search by username..." oninput="onUserSearchInput()">
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Kullanıcı</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th>Companies</th>
                            <th>Created</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                        <tr><td colspan="7" style="text-align:center;color:var(--text-light);">Loading...</td></tr>
                    </tbody>
                </table>
                <div id="usersPagination"></div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Create User</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="../js/admin.js"></script>
    <script>
        // --- Global Değişkenler ---
        let allCompanies = [];
        // Kullanıcı verilerini ID'ye göre saklamak için bir obje
        let usersMap = {};
        // Düzenleme sırasında butonu kilitlemek için
        let isEditSubmitting = false;
        let isCreateSubmitting = false;

        // P1 madde 4 — rol yaratma matrisi (frontend UX katmanı;
        // gerçek kontrol backend'de canAssignRole() ile yapılır).
        // ADMIN: 5 rolün tümünü atayabilir.
        // ACCOUNTANT_MANAGER: yalnızca ACCOUNTANT/CONTROLLER/VIEWER
        // atayabilir (ADMIN veya ACCOUNTANT_MANAGER OLUŞTURAMAZ).
        const ROLES_ASSIGNABLE_BY = {
            ADMIN: ["ADMIN", "ACCOUNTANT_MANAGER", "ACCOUNTANT", "CONTROLLER", "VIEWER"],
            ACCOUNTANT_MANAGER: ["ACCOUNTANT", "CONTROLLER", "VIEWER"]
        };

        function getCurrentAdminUser() {
            try {
                return JSON.parse(localStorage.getItem("current_user") || "null");
            } catch (_) {
                return null;
            }
        }

        function getAssignableRoles() {
            const me = getCurrentAdminUser();
            return ROLES_ASSIGNABLE_BY[me && me.role] || [];
        }

        function roleOptionsHtml(selectedRole) {
            return getAssignableRoles().map(r =>
                `<option value="${r}" ${r === selectedRole ? "selected" : ""}>${r}</option>`
            ).join("");
        }

        // --- Mevcut Fonksiyonlar (Yeni eklenenlerle birlikte) ---

        async function loadCompaniesForSelect() {
            try {
                // Dropdown için tam liste gerekir — sayfalama limitiyle
                // (varsayılan 50) kesilmesin diye yüksek bir limit veriyoruz.
                // Not: backend zaten ACCOUNTANT_MANAGER için kendi holding
                // ağacıyla scope'luyor (requireStaffAccess) — burada ekstra
                // bir filtreleme gerekmiyor.
                const result = await AdminAPI.getCompanies({ limit: 500 });
                if (result.success) {
                    allCompanies = result.data;
                }
            } catch (error) {
                console.error('Load companies error:', error);
            }
        }

        async function loadUsers() {
            try {
                const params = { limit: usersState.limit, offset: usersState.offset };
                if (usersState.search) params.search = usersState.search;

                const result = await AdminAPI.getUsers(params);
                if (!result.success) {
                    document.getElementById('usersTableBody').innerHTML = 
                        `<tr><td colspan="7" style="text-align:center;color:var(--danger);">Error: ${describeApiError(result)}</td></tr>`;
                    return;
                }
                
                // Kullanıcı verilerini haritaya kaydet
                usersMap = {};
                result.data.forEach(user => {
                    usersMap[user.id] = user;
                });

                const html = result.data.map(u => {
                    const fullName = [u.first_name, u.last_name].filter(Boolean).join(' ');
                    return `
                    <tr>
                        <td>
                            <strong>${escapeHtml(fullName || u.username)}</strong>
                            ${fullName ? `<br><small style="color:var(--text-light);">${escapeHtml(u.username)}</small>` : ''}
                            ${u.must_change_password ? '<br><small style="color:var(--warning, #d68910);">Şifre değişikliği bekleniyor</small>' : ''}
                        </td>
                        <td>${escapeHtml(u.email || '-')}</td>
                        <td><span class="badge badge-active">${escapeHtml(u.role || 'VIEWER')}</span></td>
                        <td>${getStatusBadge(u.status)}</td>
                        <td>${(u.companies || []).map(c => escapeHtml(c.company_name)).join(', ')}</td>
                        <td>${formatDateShort(u.created_at)}</td>
                        <td>
                            <button class="btn btn-sm btn-outline" onclick="editUser('${u.id}')">Edit</button>
                        </td>
                    </tr>
                `;
                }).join('');
                
                document.getElementById('usersTableBody').innerHTML = html || 
                    `<tr><td colspan="7" style="text-align:center;color:var(--text-light);">No users found</td></tr>`;

                document.getElementById('usersPagination').innerHTML =
                    renderPagination(result.pagination, changeUsersPage);
                    
            } catch (error) {
                console.error('Load users error:', error);
            }
        }

        let usersState = { search: '', limit: 20, offset: 0 };

        function onUserSearchInput() {
            debouncedUserSearch();
        }

        const debouncedUserSearch = debounce(() => {
            usersState.search = document.getElementById('userSearchInput').value.trim();
            usersState.offset = 0;
            loadUsers();
        }, 350);

        function changeUsersPage(newOffset) {
            usersState.offset = newOffset;
            loadUsers();
        }

        // --- YENİ / GÜNCELLENEN FONKSİYONLAR ---

        // 1. Düzenleme Modal'ını Göster
        function editUser(userId) {
            // Daha önce yüklenmiş kullanıcı verilerini bul
            const user = usersMap[userId];
            if (!user) {
                alert('Kullanıcı verileri bulunamadı. Lütfen sayfayı yenileyin.');
                return;
            }

            // Mevcut kullanıcının şirket ID'lerini al
            const currentCompanyIds = (user.companies || []).map(c => c.company_id);

            // Şirket seçeneklerini oluştur
            const companyOptions = allCompanies.map(c => 
                `<option value="${c.id}" ${currentCompanyIds.includes(c.id) ? 'selected' : ''}>${escapeHtml(c.name)} (${escapeHtml(c.code)})</option>`
            ).join('');

            // Rol seçenekleri — mevcut kullanıcının rolü, düzenleyenin
            // atayabileceği roller arasında yoksa (örn. bir
            // ACCOUNTANT_MANAGER başka bir ACCOUNTANT_MANAGER'ı
            // görüntülüyorsa) yine de seçili gösterilir ama listeye
            // eklenmez — backend zaten böyle bir değişikliği reddeder,
            // burada sadece mevcut değerin kaybolmamasını sağlıyoruz.
            let roleOptions = roleOptionsHtml(user.role);
            if (!getAssignableRoles().includes(user.role)) {
                roleOptions = `<option value="${user.role}" selected>${user.role} (değiştirilemez)</option>` + roleOptions;
            }

            // Modal içeriğini oluştur
            const modalContent = `
                <form id="editUserForm" onsubmit="saveUserEdit(event, '${user.id}')">
                    <div class="form-group">
                        <label>Username (readonly)</label>
                        <input type="text" value="${escapeHtml(user.username)}" readonly style="background:#f0f0f0;">
                    </div>
                    <div class="form-group">
                        <label>Ad</label>
                        <input type="text" name="first_name" value="${escapeHtml(user.first_name || '')}" maxlength="100">
                    </div>
                    <div class="form-group">
                        <label>Soyad</label>
                        <input type="text" name="last_name" value="${escapeHtml(user.last_name || '')}" maxlength="100">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" name="email" value="${escapeHtml(user.email || '')}" maxlength="150">
                    </div>
                    <div class="form-group">
                        <label>Role</label>
                        <select name="role" required>${roleOptions}</select>
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <select name="status" required>
                            <option value="ACTIVE" ${user.status === 'ACTIVE' ? 'selected' : ''}>ACTIVE</option>
                            <option value="INACTIVE" ${user.status === 'INACTIVE' ? 'selected' : ''}>INACTIVE</option>
                        </select>
                        <small style="color:var(--text-light);">INACTIVE: kullanıcı giriş yapamaz ve lisans kullanıcı limitine dahil edilmez.</small>
                    </div>
                    <div class="form-group">
                        <label>Companies</label>
                        <select name="company_ids" multiple style="height:120px;">
                            ${companyOptions}
                        </select>
                        <small style="color:var(--text-light);">Hold Ctrl to select multiple. Select none to remove all assignments.</small>
                    </div>
                    <div id="editFormError" style="color:var(--danger); margin-bottom:12px; display:none;"></div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
                        <button type="submit" class="btn btn-primary" id="editSubmitBtn">Save Changes</button>
                    </div>
                </form>
            `;

            showModal(`Edit User: ${escapeHtml(user.username)}`, modalContent);
        }

        // 2. Düzenleme Formunu Kaydet
        async function saveUserEdit(event, userId) {
            event.preventDefault();
            
            // Eğer zaten bir işlem devam ediyorsa, çık
            if (isEditSubmitting) return;
            
            const form = event.target;
            const submitBtn = document.getElementById('editSubmitBtn');
            const errorDiv = document.getElementById('editFormError');
            
            // Butonu devre dışı bırak ve metni değiştir
            isEditSubmitting = true;
            submitBtn.disabled = true;
            submitBtn.textContent = 'Saving...';
            errorDiv.style.display = 'none';

            // Seçili şirket ID'lerini al
            const companySelect = form.company_ids;
            const company_ids = Array.from(companySelect.selectedOptions).map(opt => opt.value);

            const data = {
                role: form.role.value,
                status: form.status.value,
                company_ids: company_ids,
                first_name: form.first_name.value.trim(),
                last_name: form.last_name.value.trim(),
                email: form.email.value.trim()
            };

            try {
                const result = await AdminAPI.updateUser(userId, data);
                
                if (result.success) {
                    // Başarılı
                    closeModal();
                    await loadUsers(); // Listeyi yenile
                } else {
                    // Hata
                    errorDiv.textContent = describeApiError(result);
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                console.error('Update user error:', error);
                errorDiv.textContent = 'Bir hata oluştu: ' + error.message;
                errorDiv.style.display = 'block';
            } finally {
                // Butonu tekrar aktif et
                isEditSubmitting = false;
                submitBtn.disabled = false;
                submitBtn.textContent = 'Save Changes';
            }
        }

        // --- Kullanıcı Oluşturma ---
        // P0/P1 DÜZELTMESİ: önceden bu form yalnızca username/password/
        // role(VIEWER|ADMIN)/status/companies içeriyordu — email, ad,
        // soyad hiç yoktu; role seçimi yalnızca 2 sabit değere izin
        // veriyordu (ACCOUNTANT_MANAGER/ACCOUNTANT/CONTROLLER hiç
        // oluşturulamıyordu); password minlength=6 backend'in gerçek
        // kuralıyla (>=10) çelişiyordu.
        function showCreateUserModal() {
            const companyOptions = allCompanies.map(c => 
                `<option value="${c.id}">${escapeHtml(c.name)} (${escapeHtml(c.code)})</option>`
            ).join('');

            const roleOptions = roleOptionsHtml();
            
            const content = `
                <form id="createUserForm" onsubmit="createUser(event)">
                    <div class="form-group">
                        <label>Ad</label>
                        <input type="text" name="first_name" maxlength="100" placeholder="e.g. Görkem">
                    </div>
                    <div class="form-group">
                        <label>Soyad</label>
                        <input type="text" name="last_name" maxlength="100" placeholder="e.g. Karaağaç">
                    </div>
                    <div class="form-group">
                        <label>Email *</label>
                        <input type="email" name="email" required maxlength="150" placeholder="e.g. gorkem@example.com">
                        <small style="color:var(--text-light);">Giriş kimliği olarak kullanılacaktır.</small>
                    </div>
                    <div class="form-group">
                        <label>İlk Şifre *</label>
                        <input type="password" name="password" required minlength="10" placeholder="En az 10 karakter">
                    </div>
                    <div class="form-group">
                        <label>Role</label>
                        <select name="role">${roleOptions}</select>
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <select name="status">
                            <option value="ACTIVE">ACTIVE</option>
                            <option value="INACTIVE">INACTIVE</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Companies</label>
                        <select name="company_ids" multiple style="height:100px;">
                            ${companyOptions}
                        </select>
                        <small style="color:var(--text-light);">Hold Ctrl to select multiple</small>
                    </div>
                    <div id="createUserError" style="color:var(--danger); margin-bottom:12px; display:none;"></div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
                        <button type="submit" class="btn btn-primary" id="createUserSubmitBtn">Create User</button>
                    </div>
                </form>
            `;
            showModal('Create User', content);
        }

        async function createUser(event) {
            event.preventDefault();
            if (isCreateSubmitting) return;

            const form = event.target;
            const errorDiv = document.getElementById('createUserError');
            const submitBtn = document.getElementById('createUserSubmitBtn');

            isCreateSubmitting = true;
            submitBtn.disabled = true;
            submitBtn.textContent = 'Saving...';
            errorDiv.style.display = 'none';
            
            const companySelect = form.company_ids;
            const company_ids = Array.from(companySelect.selectedOptions).map(opt => opt.value);
            
            // NOT: username GÖNDERİLMİYOR — backend, username
            // belirtilmezse email'i username olarak kullanır (bkz.
            // routes/admin.js POST /users P0 yorumu).
            const data = {
                email: form.email.value.trim(),
                first_name: form.first_name.value.trim(),
                last_name: form.last_name.value.trim(),
                password: form.password.value,
                role: form.role.value,
                status: form.status.value,
                company_ids: company_ids.length > 0 ? company_ids : []
            };
            
            try {
                const result = await AdminAPI.createUser(data);
                if (result.success) {
                    closeModal();
                    loadUsers();
                } else {
                    errorDiv.textContent = describeApiError(result);
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                errorDiv.textContent = 'Kullanıcı oluşturulurken hata oluştu: ' + error.message;
                errorDiv.style.display = 'block';
            } finally {
                isCreateSubmitting = false;
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create User';
            }
        }

        // --- Sayfa Yükleme ---
        document.addEventListener('DOMContentLoaded', async () => {
            // P2: ACCOUNTANT_MANAGER de bu sayfaya erişebilir (bkz.
            // requireStaffAccess — backend/middleware/admin.js).
            const authenticated = await checkAdminAuth(['ADMIN', 'ACCOUNTANT_MANAGER']);
            if (authenticated) {
                await loadCompaniesForSelect();
                loadUsers();
            }
        });

        // --- Güvenlik Uyarısı (Konsola) ---
        console.warn('Security Note: This frontend is for UI purposes only. All critical authorization checks are performed on the backend.');
    </script>
</body>
</html>
