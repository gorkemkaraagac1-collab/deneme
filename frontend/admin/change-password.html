<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parola Değiştir - Admin Panel</title>
    <link rel="stylesheet" href="css/admin.css">
    <style>
        /*
         * Bu sayfa normal admin layout'unu (sidebar) KULLANMIYOR —
         * kullanıcı parolasını değiştirene kadar hiçbir başka sayfaya
         * erişemez (backend requireAuth seviyesinde zaten engelliyor,
         * bkz. middleware/auth.js MUST_CHANGE_PASSWORD_EXEMPT_ROUTES),
         * o yüzden sidebar/nav göstermek yanıltıcı olurdu.
         */
        body {
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .cp-container {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 32px;
            width: 100%;
            max-width: 420px;
        }
        .cp-container h1 {
            font-size: 20px;
            margin-bottom: 4px;
        }
        .cp-container .subtitle {
            color: var(--text-light);
            font-size: 14px;
            margin-bottom: 20px;
        }
        .cp-error {
            background: #fadbd8;
            color: #922b21;
            padding: 10px 12px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 13px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="cp-container">
        <h1>Parolanızı Değiştirin</h1>
        <p class="subtitle" id="cpSubtitle">Devam etmeden önce parolanızı değiştirmeniz gerekiyor.</p>
        <div id="cpError" class="cp-error"></div>
        <form id="changePasswordForm" onsubmit="handleChangePassword(event)">
            <div class="form-group">
                <label>Mevcut Şifre *</label>
                <input type="password" id="currentPassword" required autocomplete="current-password">
            </div>
            <div class="form-group">
                <label>Yeni Şifre * (en az 10 karakter)</label>
                <input type="password" id="newPassword" required minlength="10" autocomplete="new-password">
            </div>
            <div class="form-group">
                <label>Yeni Şifre (Tekrar) *</label>
                <input type="password" id="newPasswordConfirm" required minlength="10" autocomplete="new-password">
            </div>
            <div class="modal-footer" style="justify-content:flex-end; margin-top:8px;">
                <button type="submit" class="btn btn-primary" id="cpSubmitBtn">Şifreyi Değiştir</button>
            </div>
        </form>
    </div>

    <script>
        const API_BASE_URL =
            "https://deneme-git-285469227510.europe-west1.run.app";

        /*
         * ÖNEMLİ: bu sayfa admin.js'teki checkAdminAuth()'u ÇAĞIRMAZ.
         * checkAdminAuth, mustChangePassword=true gördüğünde bu sayfaya
         * yönlendirir — eğer bu sayfa da checkAdminAuth çağırsaydı,
         * sonsuz bir yönlendirme döngüsü oluşurdu. Bunun yerine burada
         * ayrı, hafif bir kontrol var: sadece token var mı ve
         * mustChangePassword gerçekten true mu bakılır (GET /me —
         * requireAuth'un istisna tuttuğu iki endpoint'ten biri).
         */
        async function checkMustChangePassword() {
            const token = localStorage.getItem("access_token");
            if (!token) {
                window.location.href = "../login.html";
                return;
            }
            try {
                const response = await fetch(`${API_BASE_URL}/api/auth/me`, {
                    method: "GET",
                    headers: { "Authorization": `Bearer ${token}` }
                });
                if (!response.ok) {
                    localStorage.removeItem("access_token");
                    localStorage.removeItem("current_user");
                    window.location.href = "../login.html";
                    return;
                }
                const result = await response.json();
                const user = result.data || result.user;
                if (!user) {
                    window.location.href = "../login.html";
                    return;
                }
                if (!user.mustChangePassword) {
                    /*
                     * Parola zaten değiştirilmiş (örn. kullanıcı bu
                     * sayfayı elle tekrar açtı) — normal akışa geri
                     * yönlendir.
                     */
                    window.location.href =
                        user.role === "ADMIN" || user.role === "ACCOUNTANT_MANAGER"
                            ? "index.html"
                            : "../dashboard.html";
                    return;
                }
                localStorage.setItem("current_user", JSON.stringify(user));
            } catch (error) {
                console.error("mustChangePassword check error:", error);
            }
        }

        async function handleChangePassword(event) {
            event.preventDefault();

            const currentPassword = document.getElementById("currentPassword").value;
            const newPassword = document.getElementById("newPassword").value;
            const newPasswordConfirm = document.getElementById("newPasswordConfirm").value;
            const errorEl = document.getElementById("cpError");
            const submitBtn = document.getElementById("cpSubmitBtn");

            errorEl.style.display = "none";

            if (newPassword !== newPasswordConfirm) {
                errorEl.textContent = "Yeni şifreler eşleşmiyor.";
                errorEl.style.display = "block";
                return;
            }
            if (newPassword.length < 10) {
                errorEl.textContent = "Yeni şifre en az 10 karakter olmalıdır.";
                errorEl.style.display = "block";
                return;
            }

            const token = localStorage.getItem("access_token");
            submitBtn.disabled = true;
            submitBtn.textContent = "Kaydediliyor...";

            try {
                const response = await fetch(`${API_BASE_URL}/api/auth/change-password`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    },
                    body: JSON.stringify({ currentPassword, newPassword })
                });
                const result = await response.json();

                if (!response.ok) {
                    errorEl.textContent = result.error || "Şifre değiştirilemedi.";
                    errorEl.style.display = "block";
                    submitBtn.disabled = false;
                    submitBtn.textContent = "Şifreyi Değiştir";
                    return;
                }

                /*
                 * Backend YENİ bir token döner (mustChangePassword=false) —
                 * bu token'ı yazmazsak kullanıcı bir sonraki istekte
                 * hâlâ eski (mustChangePassword=true) token ile 403 alır.
                 */
                localStorage.setItem("access_token", result.token);
                localStorage.setItem("current_user", JSON.stringify(result.user));

                window.location.href =
                    result.user.role === "ADMIN" || result.user.role === "ACCOUNTANT_MANAGER"
                        ? "index.html"
                        : "../dashboard.html";

            } catch (error) {
                errorEl.textContent = "Bağlantı hatası: " + error.message;
                errorEl.style.display = "block";
                submitBtn.disabled = false;
                submitBtn.textContent = "Şifreyi Değiştir";
            }
        }

        document.addEventListener("DOMContentLoaded", checkMustChangePassword);
    </script>
</body>
</html>
