<!doctype html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TCMB Kurları</title><link rel="stylesheet" href="css/admin.css"></head><body><main class="main-content"><header class="top-header"><div class="page-title">TCMB Kurları</div><div class="user-info"><span id="adminUsername"></span><button class="btn-logout" onclick="logout()">Logout</button></div></header><div class="page-content"><p>TCMB USD/TRY ve EUR/TRY kayıtlarını yönetin. PENDING kayıtları kontrol edip doğrulayın.</p><p><input id="fromDate" type="date" value="2019-01-01"><input id="toDate" type="date" value="2019-12-31"><button class="btn-primary" id="syncBtn">Kurları getir</button></p><div id="msg"></div><table><thead><tr><th>Tarih</th><th>Parite</th><th>Kur</th><th>Durum</th><th></th></tr></thead><tbody id="rows"><tr><td colspan="5">Yükleniyor...</td></tr></tbody></table></div></main><script src="../js/admin.js"></script><script>const H=()=>({"Content-Type":"application/json",Authorization:'Bearer '+localStorage.getItem('access_token')});const e=s=>escapeHtml(String(s??''));async function load(){const r=await fetch(API_BASE_URL+'/api/fx-rates/pending',{headers:H()}).then(x=>x.json());rows.innerHTML=(r.rates||[]).map(x=>'<tr><td>'+e(x.rateDate)+'</td><td>'+e(x.fromCurrency)+'/'+e(x.toCurrency)+'</td><td>'+Number(x.rate).toLocaleString('tr-TR',{minimumFractionDigits:4})+'</td><td>'+e(x.verificationStatus)+'</td><td><button data-id="'+x.id+'">Doğrula</button></td></tr>').join('')||'<tr><td colspan="5">Bekleyen kur yok.</td></tr>';rows.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{await fetch(API_BASE_URL+'/api/fx-rates/'+b.dataset.id+'/verify',{method:'POST',headers:H()});load()})}syncBtn.onclick=async()=>{msg.textContent='Senkronizasyon sürüyor...';const r=await fetch(API_BASE_URL+'/api/fx-rates/sync',{method:'POST',headers:H(),body:JSON.stringify({from:fromDate.value,to:toDate.value})}).then(x=>x.json());msg.textContent=r.error||'Senkronizasyon tamamlandı.';load()};document.addEventListener('DOMContentLoaded',async()=>{if(await checkAdminAuth())load()});</script></body></html>
