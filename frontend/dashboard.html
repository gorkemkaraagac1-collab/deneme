<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontrol Paneli — Finansal Zeka Platformu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
            color: #2c3e50;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 24px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 24px;
            border-bottom: 1px solid #e1e8ed;
            margin-bottom: 32px;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 600;
        }
        .header .user-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .header .username {
            font-weight: 500;
        }
        .btn-logout {
            background: none;
            border: 1px solid #e1e8ed;
            padding: 6px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            color: #2c3e50;
            transition: all 0.2s;
        }
        .btn-logout:hover {
            background: #e74c3c;
            color: #fff;
            border-color: #e74c3c;
        }
        .welcome {
            margin-bottom: 32px;
        }
        .welcome h2 {
            font-size: 28px;
            font-weight: 600;
        }
        .welcome p {
            color: #7f8c8d;
            margin-top: 4px;
        }
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }
        .card {
            background: #fff;
            border-radius: 8px;
            padding: 20px 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            border-left: 4px solid #3498db;
        }
        .card .label {
            font-size: 14px;
            color: #7f8c8d;
            font-weight: 500;
            margin-bottom: 8px;
        }
        .card .value {
            font-size: 24px;
            font-weight: 700;
            margin-top: 4px;
        }
        .card .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-size: 14px;
        }
        .card .detail-row .label-sm {
            color: #7f8c8d;
        }
        .card .detail-row .value-sm {
            font-weight: 500;
        }
        .card.success { border-left-color: #2ecc71; }
        .card.warning { border-left-color: #f39c12; }
        .card.danger { border-left-color: #e74c3c; }
        .card.info { border-left-color: #3498db; }
        
        .modules {
            background: #fff;
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .modules h3 {
            margin-bottom: 16px;
            font-size: 16px;
        }
        .module-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }
        .module-item {
            padding: 16px;
            border: 1px solid #e1e8ed;
            border-radius: 6px;
            text-align: center;
            transition: all 0.2s;
        }
        .module-item:hover {
            border-color: #3498db;
            background: #f8f9fa;
        }
        .module-item .icon {
            font-size: 32px;
            display: block;
            margin-bottom: 8px;
        }
        .module-item .name {
            font-weight: 500;
            font-size: 14px;
        }
        .module-item .status {
            font-size: 12px;
            color: #7f8c8d;
            margin-top: 4px;
        }
        .module-item.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .module-item.locked .status {
            color: #e74c3c;
        }
        .module-item.unlocked .status {
            color: #2ecc71;
        }
        
        .status-badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }
        .status-badge.active {
            background: #d5f5e3;
            color: #1a7a3a;
        }
        .status-badge.inactive {
            background: #fadbd8;
            color: #922b21;
        }
        .status-badge.expired {
            background: #e8e8e8;
            color: #5d6d7e;
        }
        .status-badge.pending {
            background: #fdebd0;
            color: #a04000;
        }

        #companyInfo {
            display: none;
        }
        .error-msg {
            background: #fadbd8;
            color: #922b21;
            padding: 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }
        .loading-spinner {
            color: #7f8c8d;
            font-size: 14px;
        }

        .module-item.module-link {
            display: block;
            text-decoration: none;
            color: inherit;
            cursor: pointer;
        }
        .module-item.module-link:hover {
            border-color: #3498db;
            background: #f0f7ff;
            transform: translateY(-1px);
        }
        .no-license-msg {
            color: #7f8c8d;
            font-size: 14px;
            padding: 8px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>Finansal Zeka Platformu</h1>
            <div class="user-info">
                <span class="username" id="userDisplay">Yükleniyor...</span>
                <button class="btn-logout" onclick="logout()">Çıkış Yap</button>
            </div>
        </div>

        <!-- Error Message -->
        <div id="errorMsg" class="error-msg"></div>

        <!-- Company Info Section -->
        <div id="companyInfo">
            <div class="welcome">
                <h2 id="welcomeUser">Hoş geldiniz!</h2>
                <p id="companyDisplay">Şirket bilgileri yükleniyor...</p>
            </div>

            <!-- Dashboard Cards -->
            <div class="cards" id="dashboardCards">
                <!-- Company Card -->
                <div class="card info">
                    <div class="label">Şirket</div>
                    <div class="value" id="companyName">-</div>
                </div>

                <!-- License Card -->
                <div class="card success" id="licenseCard" style="display: none;">
                    <div class="label">Lisans / Abonelik</div>
                    <div id="licenseContent">
                        <!-- Loading State -->
                        <div id="licenseLoading" class="loading-spinner">Lisans bilgileri yükleniyor...</div>
                        
                        <!-- Success State -->
                        <div id="licenseSuccess" style="display: none;">
                            <div class="detail-row">
                                <span class="label-sm">Plan</span>
                                <span class="value-sm" id="licensePlan">-</span>
                            </div>
                            <div class="detail-row">
                                <span class="label-sm">Durum</span>
                                <span class="value-sm" id="licenseStatusBadge">-</span>
                            </div>
                            <div class="detail-row">
                                <span class="label-sm">Başlangıç</span>
                                <span class="value-sm" id="licenseStart">-</span>
                            </div>
                            <div class="detail-row">
                                <span class="label-sm">Bitiş</span>
                                <span class="value-sm" id="licenseEnd">-</span>
                            </div>
                            <div class="detail-row">
                                <span class="label-sm">Maks. Kullanıcı</span>
                                <span class="value-sm" id="licenseMaxUsers">-</span>
                            </div>
                        </div>
                        
                        <!-- No License State -->
                        <div id="licenseNoLicense" style="display: none;">
                            <p class="no-license-msg">Bu şirket için aktif lisans bulunamadı.</p>
                        </div>
                        
                        <!-- Error State -->
                        <div id="licenseError" style="display: none; color: #e74c3c; font-size: 14px;">
                            Lisans bilgileri yüklenemedi.
                        </div>
                    </div>
                </div>
            </div>

            <!-- Available Modules -->
            <div class="modules">
                <h3>Kullanılabilir Modüller</h3>
                <div class="module-grid" id="moduleGrid">
                    <!-- JS ile doldurulacak -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // Dashboard - Backend JWT Entegrasyonu + License Bilgisi
        // ============================================================

        // Backend: Cloud Run (frontend GitHub Pages'te barındığı için
        // relative "/api/..." istekleri kendi origin'ine gider, backend'e değil)
        const API_BASE_URL = "https://deneme-git-285469227510.europe-west1.run.app";

        // --- Helper Functions ---
        function getToken() {
            return localStorage.getItem('access_token');
        }

        async function fetchAPI(url, options = {}) {
            const token = getToken();
            const response = await fetch(`${API_BASE_URL}${url}`, {
                ...options,
                headers: {
                    'Content-Type': 'application/json',
                    ...(token ? { 'Authorization': `Bearer ${token}` } : {}),
                    ...(options.headers || {})
                }
            });
            return response.json();
        }

        function logout() {
            localStorage.removeItem('access_token');
            window.location.href = './login.html';
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            const d = new Date(dateStr);
            return d.toLocaleDateString('tr-TR') + ' ' + d.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
        }

        function formatDateShort(dateStr) {
            if (!dateStr) return '-';
            const d = new Date(dateStr);
            return d.toLocaleDateString('tr-TR');
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function getStatusBadge(status) {
            const statusMap = {
                'ACTIVE': '<span class="status-badge active">AKTİF</span>',
                'active': '<span class="status-badge active">AKTİF</span>',
                'INACTIVE': '<span class="status-badge inactive">PASİF</span>',
                'inactive': '<span class="status-badge inactive">PASİF</span>',
                'EXPIRED': '<span class="status-badge expired">SÜRESİ DOLMUŞ</span>',
                'expired': '<span class="status-badge expired">SÜRESİ DOLMUŞ</span>',
                'PENDING': '<span class="status-badge pending">BEKLEMEDE</span>',
                'pending': '<span class="status-badge pending">BEKLEMEDE</span>'
            };
            return statusMap[status] || `<span class="status-badge">${escapeHtml(status || 'UNKNOWN')}</span>`;
        }

        // --- Load Dashboard ---
        async function loadDashboard() {
            const token = getToken();
            if (!token) {
                window.location.href = './login.html';
                return;
            }

            try {
                // 1. Mevcut kullanıcı bilgisi
                const meResult = await fetchAPI('/api/auth/me');
                if (!meResult.success) {
                    localStorage.removeItem('access_token');
                    window.location.href = './login.html';
                    return;
                }

                const user = meResult.data;
                document.getElementById('userDisplay').textContent = user.username;
                document.getElementById('welcomeUser').textContent = `Hoş geldiniz, ${user.username}!`;

                // 2. Kullanıcının şirket bilgilerini al
                if (!user.companyIds || user.companyIds.length === 0) {
                    document.getElementById('companyDisplay').textContent = 'Atanmış şirket yok';
                    document.getElementById('companyInfo').style.display = 'block';
                    return;
                }

                const companyId = user.companyIds[0];
                document.getElementById('companyDisplay').textContent = `Şirket ID: ${companyId}`;

                // 3. Şirket bilgilerini al (opsiyonel)
                await loadCompanyInfo(companyId);

                // 4. License bilgilerini al
                await loadLicenseInfo();

                // 5. Module grid'i göster
                loadModuleGrid();

                document.getElementById('companyInfo').style.display = 'block';

            } catch (error) {
                console.error('Dashboard load error:', error);
                const errorEl = document.getElementById('errorMsg');
                errorEl.textContent = 'Kontrol paneli yüklenemedi: ' + error.message;
                errorEl.style.display = 'block';
            }
        }

        // --- Load Company Info ---
        async function loadCompanyInfo(companyId) {
            try {
                const result = await fetchAPI(`/api/admin/companies/${companyId}`);
                if (result.success && result.data) {
                    document.getElementById('companyName').textContent = result.data.name || result.data.code || '-';
                } else {
                    document.getElementById('companyName').textContent = 'Şirket #' + companyId;
                }
            } catch (error) {
                console.error('Company info error:', error);
                document.getElementById('companyName').textContent = 'Şirket #' + companyId;
            }
        }

        // --- Load License Info ---
        async function loadLicenseInfo() {
            const licenseCard = document.getElementById('licenseCard');
            const loadingEl = document.getElementById('licenseLoading');
            const successEl = document.getElementById('licenseSuccess');
            const noLicenseEl = document.getElementById('licenseNoLicense');
            const errorEl = document.getElementById('licenseError');

            // Kartı göster, loading'i göster, diğerlerini gizle
            licenseCard.style.display = 'block';
            loadingEl.style.display = 'block';
            successEl.style.display = 'none';
            noLicenseEl.style.display = 'none';
            errorEl.style.display = 'none';

            try {
                const result = await fetchAPI('/api/customer/license');
                loadingEl.style.display = 'none';

                if (result.success && result.data) {
                    // Başarılı: Bilgileri göster
                    document.getElementById('licensePlan').textContent = result.data.plan_name || '-';
                    
                    const statusHtml = getStatusBadge(result.data.license_status);
                    document.getElementById('licenseStatusBadge').innerHTML = statusHtml;
                    
                    document.getElementById('licenseStart').textContent = formatDateShort(result.data.start_date);
                    document.getElementById('licenseEnd').textContent = formatDateShort(result.data.end_date);
                    document.getElementById('licenseMaxUsers').textContent = result.data.max_users || '∞';
                    
                    successEl.style.display = 'block';
                    
                } else if (result.error && result.error.includes('No active license')) {
                    // Lisans yok
                    noLicenseEl.style.display = 'block';
                } else {
                    // Diğer hatalar
                    errorEl.textContent = 'Hata: ' + (result.error || 'Bilinmeyen hata');
                    errorEl.style.display = 'block';
                }
            } catch (error) {
                loadingEl.style.display = 'none';
                errorEl.textContent = 'Lisans yükleme hatası: ' + error.message;
                errorEl.style.display = 'block';
                console.error('License fetch error:', error);
            }
        }

        // --- Load Module Grid ---
        function loadModuleGrid() {
            // TFRS16: frontend/dashboard.html -> ../tfrs16.html (repo kökü)
            document.getElementById('moduleGrid').innerHTML = `
                <a href="../tfrs16.html" class="module-item unlocked module-link">
                    <span class="icon">📊</span>
                    <div class="name">TFRS 16</div>
                    <div class="status">✓ Kullanılabilir</div>
                </a>
                <div class="module-item locked" title="Yakında">
                    <span class="icon">🔒</span>
                    <div class="name">TMS 19</div>
                    <div class="status">Yakında</div>
                </div>
                <div class="module-item locked" title="Yakında">
                    <span class="icon">🔒</span>
                    <div class="name">DCF</div>
                    <div class="status">Yakında</div>
                </div>
                <div class="module-item locked" title="Yakında">
                    <span class="icon">🔒</span>
                    <div class="name">Hedge Muhasebesi</div>
                    <div class="status">Yakında</div>
                </div>
            `;
        }

        // --- Auto-login check ---
        document.addEventListener('DOMContentLoaded', loadDashboard);
    </script>
</body>
</html>
