<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontrol Paneli — Finansal Zeka Platformu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
            color: #2c3e50;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 24px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 24px;
            border-bottom: 1px solid #e1e8ed;
            margin-bottom: 32px;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 600;
        }
        .header .user-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .header .username {
            font-weight: 500;
        }
        .btn-logout {
            background: none;
            border: 1px solid #e1e8ed;
            padding: 6px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            color: #2c3e50;
            transition: all 0.2s;
        }
        .btn-logout:hover {
            background: #e74c3c;
            color: #fff;
            border-color: #e74c3c;
        }
        .welcome {
            margin-bottom: 32px;
        }
        .welcome h2 {
            font-size: 28px;
            font-weight: 600;
        }
        .welcome p {
            color: #7f8c8d;
            margin-top: 4px;
        }
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }
        .card {
            background: #fff;
            border-radius: 8px;
            padding: 20px 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            border-left: 4px solid #3498db;
        }
        .card .label {
            font-size: 14px;
            color: #7f8c8d;
            font-weight: 500;
            margin-bottom: 8px;
        }
        .card .value {
            font-size: 24px;
            font-weight: 700;
            margin-top: 4px;
        }
        .card .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-size: 14px;
        }
        .card .detail-row .label-sm {
            color: #7f8c8d;
        }
        .card .detail-row .value-sm {
            font-weight: 500;
        }
        .card.success { border-left-color: #2ecc71; }
        .card.warning { border-left-color: #f39c12; }
        .card.danger { border-left-color: #e74c3c; }
        .card.info { border-left-color: #3498db; }
        
        .modules {
            background: #fff;
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .modules h3 {
            margin-bottom: 16px;
            font-size: 16px;
        }
        .module-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }
        .module-item {
            padding: 16px;
            border: 1px solid #e1e8ed;
            border-radius: 6px;
            text-align: center;
            transition: all 0.2s;
        }
        .module-item:hover {
            border-color: #3498db;
            background: #f8f9fa;
        }
        .module-item .icon {
            font-size: 32px;
            display: block;
            margin-bottom: 8px;
        }
        .module-item .name {
            font-weight: 500;
            font-size: 14px;
        }
        .module-item .status {
            font-size: 12px;
            color: #7f8c8d;
            margin-top: 4px;
        }
        .module-item.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .module-item.locked .status {
            color: #e74c3c;
        }
        .module-item.unlocked .status {
            color: #2ecc71;
        }
        
        .status-badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }
        .status-badge.active {
            background: #d5f5e3;
            color: #1a7a3a;
        }
        .status-badge.inactive {
            background: #fadbd8;
            color: #922b21;
        }
        .status-badge.expired {
            background: #e8e8e8;
            color: #5d6d7e;
        }
        .status-badge.pending {
            background: #fdebd0;
            color: #a04000;
        }

        #companyInfo {
            display: none;
        }
        .error-msg {
            background: #fadbd8;
            color: #922b21;
            padding: 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }
        .loading-spinner {
            color: #7f8c8d;
            font-size: 14px;
        }

        .module-item.module-link {
            display: block;
            text-decoration: none;
            color: inherit;
            cursor: pointer;
        }
        .module-item.module-link:hover {
            border-color: #3498db;
            background: #f0f7ff;
            transform: translateY(-1px);
        }
        .no-license-msg {
            color: #7f8c8d;
            font-size: 14px;
            padding: 8px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>Finansal Zeka Platformu</h1>
