<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hizmet | GK Advisory</title><meta name="description" content="GK Advisory hizmet detayları."><link rel="stylesheet" href="styles.css"><style>
.detail{padding:150px 0 100px}.hero-detail{max-width:800px}.hero-detail .acct{font-family:'JetBrains Mono',monospace;color:var(--brass-dark);font-size:12px;letter-spacing:.1em}.hero-detail h1{font-family:'Fraunces',serif;color:var(--ink);font-size:clamp(40px,5vw,64px);line-height:1.05;margin:18px 0}.hero-detail .intro{font-size:18px;color:var(--text-mute);max-width:700px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);margin-top:60px}.detail-card{background:var(--parchment);padding:32px}.detail-card h2{font-family:'Fraunces',serif;color:var(--ink);font-size:25px;margin-bottom:14px}.detail-card p,.detail-card li{color:var(--text-mute);font-size:14px}.detail-card ul{padding-left:20px}.impact-box{margin-top:1px;background:var(--ink);color:var(--parchment);padding:38px}.impact-box h2{font-family:'Fraunces',serif;font-size:28px}.impact-box p{color:rgba(237,234,226,.72);margin-top:10px}.cta-box{margin-top:50px;padding:32px;border-top:1px solid var(--brass);display:flex;justify-content:space-between;align-items:center;gap:20px}.cta-box h2{font-family:'Fraunces',serif;color:var(--ink)}.btn{background:var(--brass);color:var(--ink);padding:13px 24px;font-weight:600}@media(max-width:760px){.detail-grid{grid-template-columns:1fr}.cta-box{flex-direction:column;align-items:flex-start}}
</style></head><body><header><nav class="nav"><a class="wordmark" href="index.html">GK <span>ADVISORY</span></a><div class="nav-links"><a href="services.html">Hizmetler</a><a href="blog.html">Knowledge Hub</a><a class="nav-cta" href="mailto:gorkemkaraagac1@gmail.com">İletişim</a></div></nav></header><main class="detail"><div class="wrap" id="app"></div></main><script>
const id=new URLSearchParams(location.search).get('id');
fetch('content.json').then(r=>r.json()).then(d=>{const s=d.services.find(x=>x.id===id)||d.services[0]; document.title=s.title+' | GK Advisory'; document.getElementById('app').innerHTML=`<div class="hero-detail"><div class="acct">${s.acct}</div><h1>${s.title}</h1><p class="intro">${s.desc}</p></div><div class="detail-grid"><section class="detail-card"><h2>Yönetim problemi</h2><p>${s.problem}</p></section><section class="detail-card"><h2>Yaklaşım</h2><p>${s.approach}</p></section><section class="detail-card"><h2>Çıktılar</h2><ul>${s.deliverables.map(x=>`<li>${x}</li>`).join('')}</ul></section><section class="detail-card"><h2>Yönetim etkisi</h2><p>${s.impact}</p></section></div><div class="cta-box"><div><h2>Bu alanı birlikte değerlendirelim.</h2><p style="color:var(--text-mute);margin-top:6px">İhtiyacınızı, kapsamı ve beklenen çıktıyı birlikte netleştirelim.</p></div><a class="btn" href="mailto:gorkemkaraagac1@gmail.com?subject=${encodeURIComponent(s.title+' hakkında görüşme')}">Görüşme Talep Et →</a></div>`})
</script></body></html>
