name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stamp frontend asset cache version
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          rm -rf _site
          mkdir _site

          # Public site files are copied from an explicit allowlist. New
          # repository files therefore cannot silently enter the deployment.
          cp -- *.html *.png *.jpeg _site/
          cp -- auth.js content.json robots.txt sitemap.xml site.webmanifest styles.css _site/
          cp -R css js frontend _site/

          python3 - <<'PY'
          from pathlib import Path
          import os, re

          page = Path('_site/tfrs16.html')
          text = page.read_text(encoding='utf-8')
          sha = os.environ['DEPLOY_SHA']
          updated, count = re.subn(
              r'js/tfrs16-engine\.js\?v=[^"\']+',
              f'js/tfrs16-engine.js?v={sha}',
              text,
          )
          if count != 1:
              raise SystemExit(f'Expected one engine asset reference, found {count}')
          page.write_text(updated, encoding='utf-8')
          PY

      - name: Verify public artifact boundary
        run: |
          forbidden="$(find _site -type f \( \
            -name '.env*' -o -name 'Dockerfile' -o -name 'package*.json' -o \
            -name '*.md' -o -name '*.xlsx' -o -name '*.sql' -o \
            -name 'playwright.config.js' -o -name 'jest.config.js' \
          \) -print)"
          if [ -n "$forbiden" ]; then
            echo "Forbidden files found in Pages artifact:"
            echo "$forbidden"
            exit 1
          fi

          test -f _site/index.html
          test -f _site/tfrs16.html
          test -f _site/js/tfrs16-engine.js
          test -f _site/frontend/admin/index.html

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
