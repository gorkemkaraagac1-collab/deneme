name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stamp frontend asset cache version
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          rsync -a --delete \
            --exclude '_site' \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'backend' \
            --exclude 'node_modules' \
            --exclude 'test' \
            --exclude 'tests' \
            --exclude 'package*.json' \
            --exclude '*.md' \
            ./ _site/
          python3 - <<'PY'
          from pathlib import Path
          import os, re

          page = Path('_site/tfrs16.html')
          text = page.read_text(encoding='utf-8')
          sha = os.environ['DEPLOY_SHA']
          updated, count = re.subn(
              r'js/tfrs16-engine\.js\?v=[^"\']+',
              f'js/tfrs16-engine.js?v={sha}',
              text,
          )
          if count != 1:
              raise SystemExit(f'Expected one engine asset reference, found {count}')
          page.write_text(updated, encoding='utf-8')
          PY

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
