name: Public Pages checks
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Pages surface
        run: |
          set -euo pipefail
          for f in index.html tfrs16.html js/shell.js js/admin.js js/tfrs16-ui.js frontend/admin/index.html; do test -f "$f"; done
          for p in backend package.json package-lock.json cloudbuild.yaml; do test ! -e "$p"; done
          # Presentation/transport tests are public source, excluded from Pages.
          # Private engines, source DTO evidence and mapping config stay forbidden.
          node scripts/check-authority-public-boundary.js
      - name: Syntax-check public scripts
        run: for f in js/*.js; do node --check "$f"; done
      - name: Verify TFRS16 private cutover gate
        run: node scripts/check-tfrs16-cutover.js
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Full frontend test suite (test-only dependencies live in test/ and are
      # never deployed); the TAP result is kept as change evidence.
      - name: Install test dependencies
        run: npm ci --prefix test --no-audit --no-fund
      - name: Frontend test suite
        run: node --test --test-timeout=60000 --test-reporter=spec --test-reporter-destination=stdout --test-reporter=tap --test-reporter-destination=test-results.tap test/*.test.js
      - name: Keep test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results-${{ github.sha }}
          path: test-results.tap
          retention-days: 400
