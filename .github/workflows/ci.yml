# .github/workflows/ci.yml
name: TFRS16 CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Install dependencies
        run: npm install
        
      - name: Lint check (ESLint)
        run: npm run lint
        
      - name: Run tests
        run: npm test

      - name: Generate candidate golden baseline
        if: always()
        run: GOLDEN_WRITE=1 npx jest test/golden/baseline-writer.test.js --runInBand

      - name: Upload candidate golden baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-baseline
          path: test/golden/baseline/
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
