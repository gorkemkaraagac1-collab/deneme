# .github/workflows/update-tufe.yml
# Legacy yardımcı araç: yalnızca elle çalıştırılır ve data/tufe-endeks.json üretir.
# Production enflasyon kayıtları bu dosyadan okunmaz; backend PostgreSQL senkronizasyonunu kullanır.
#
# MANUEL KULLANIM İÇİN GEREKLİ: Repo Settings > Secrets and variables > Actions altında
#   TUIK_API_KEY  (veya TUIK_CLIENT_ID + TUIK_CLIENT_SECRET)
# secret'ını tanımlayın.

name: Legacy TÜFE JSON Aracı (Manuel)

on:
  workflow_dispatch: {}   # manuel tetikleme için

jobs:
  update-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: TÜFE endeksini çek
        env:
          TUIK_API_KEY: ${{ secrets.TUIK_API_KEY }}
        run: node fetch-tuik-tufe.js

      # Change management: the update goes through a pull request (tests and
      # review) instead of a direct push to the protected main branch.
      - name: Değişikliği PR olarak aç
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tufe-endeks.json
          if git diff --cached --quiet; then echo "Değişiklik yok."; exit 0; fi
          BRANCH="data/tufe-$(date +%Y-%m)-${GITHUB_RUN_ID}"
          git switch -c "$BRANCH"
          git commit -m "TÜFE endeksi güncellendi ($(date +%Y-%m))"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "TÜFE endeksi güncellendi ($(date +%Y-%m))" \
            --body "Legacy TÜFE JSON aracı (manuel tetikleme, run ${GITHUB_RUN_ID}) tarafından üretildi. Production enflasyon kayıtları bu dosyadan okunmaz. İnceleyip merge edin."
