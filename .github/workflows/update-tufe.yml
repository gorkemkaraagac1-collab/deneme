# .github/workflows/update-tufe.yml
# Legacy yardımcı araç: yalnızca elle çalıştırılır ve data/tufe-endeks.json üretir.
# Production enflasyon kayıtları bu dosyadan okunmaz; backend PostgreSQL senkronizasyonunu kullanır.
#
# MANUEL KULLANIM İÇİN GEREKLİ: Repo Settings > Secrets and variables > Actions altında
#   TUIK_API_KEY  (veya TUIK_CLIENT_ID + TUIK_CLIENT_SECRET)
# secret'ını tanımlayın.

name: Legacy TÜFE JSON Aracı (Manuel)

on:
  workflow_dispatch: {}   # manuel tetikleme için

jobs:
  update-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: TÜFE endeksini çek
        env:
          TUIK_API_KEY: ${{ secrets.TUIK_API_KEY }}
        run: node fetch-tuik-tufe.js

      - name: Değişiklikleri commit'le
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tufe-endeks.json
          git diff --cached --quiet || git commit -m "TÜFE endeksi güncellendi ($(date +%Y-%m))"
          git push
