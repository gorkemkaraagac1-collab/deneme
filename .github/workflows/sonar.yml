name: Public Pages policy
on:
  pull_request:
  push:
    branches: [main]

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for server-only artifacts
        run: |
          set -euo pipefail
          if find . -path "./.git" -prune -o \( -name "*.env" -o -name "*.pem" -o -name "*.key" \) -print | grep -q .; then
            echo "server or secret artifact found in Pages repository"
            exit 1
          fi