name: Public Pages lint
on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          find js frontend -type f -name "*.js" -print0 | xargs -0 -n1 node --check