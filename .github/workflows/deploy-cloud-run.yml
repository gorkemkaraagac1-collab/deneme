name: Deploy contracts-api

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: project-0352bfb1-0930-41b8-9cf
  REGION: europe-west1
  SERVICE: contracts-api
  WIF_PROVIDER: projects/285469227510/locations/global/workloadIdentityPools/github-actions/providers/github
  DEPLOY_SA: github-cloud-run-deploy@project-0352bfb1-0930-41b8-9cf.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and deploy
        run: |
          gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet
          IMAGE="europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/contracts-api:$GITHUB_SHA"
          docker build -f backend/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          gcloud run deploy "$SERVICE" \
            --project="$PROJECT_ID" --region="$REGION" \
            --image="europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/contracts-api:$GITHUB_SHA" \
            --quiet
      - name: Health check
        run: |
          URL="$(gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')"
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$URL/health")" = "200"
