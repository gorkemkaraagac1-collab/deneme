<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Üye Paneli — GK Advisory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0F1C2E; --ink-2:#16283F; --parchment:#EDEAE2; --paper:#F7F5F0;
    --brass:#B08D57; --brass-dark:#8C6D3F; --line:rgba(176,141,87,0.35);
    --text-dark:#1C2A3A; --text-mute:#5B6472;
    --lock:#7A2E2E;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--paper); color:var(--text-dark); font-family:'Inter',sans-serif; line-height:1.6;}
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:1120px; margin:0 auto; padding:0 32px;}

  header{background:var(--ink); border-bottom:1px solid rgba(176,141,87,0.25);}
  .nav{display:flex; align-items:center; justify-content:space-between; padding:20px 32px; max-width:1120px; margin:0 auto;}
  .wordmark{color:var(--parchment); font-family:'Fraunces',serif; font-weight:600; font-size:19px;}
  .wordmark span{color:var(--brass);}
  .nav-right{display:flex; gap:24px; align-items:center;}
  .nav-right a{color:rgba(237,234,226,0.7); font-size:13.5px;}
  .nav-right a:hover{color:var(--brass);}

  .panel-hero{background:var(--ink); padding:8px 0 56px;}
  .eyebrow{
    color:var(--brass); font-family:'JetBrains Mono',monospace; font-size:12px;
    letter-spacing:0.12em; text-transform:uppercase; margin-bottom:14px;
  }
  .panel-hero h1{font-family:'Fraunces',serif; font-weight:500; font-size:clamp(28px,3.6vw,38px); color:var(--parchment);}

  .status-card{
    background:var(--ink-2); border:1px solid var(--line); padding:22px 26px; border-radius:2px;
    display:flex; justify-content:space-between; align-items:center; margin-top:28px; flex-wrap:wrap; gap:14px;
  }
  .status-card .s-item{display:flex; flex-direction:column;}
  .status-card .k{font-family:'JetBrains Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:rgba(237,234,226,0.5);}
  .status-card .v{font-family:'JetBrains Mono',monospace; font-size:18px; color:var(--parchment); margin-top:4px;}
  .status-card .v.brass{color:var(--brass);}

  .section{padding:56px 0 96px;}
  .section-tag{
    font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:0.12em; text-transform:uppercase;
    color:var(--brass-dark); margin-bottom:12px;
  }
  .section h2{font-family:'Fraunces',serif; font-weight:500; font-size:26px; color:var(--ink); margin-bottom:36px;}

  .lic-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:1px; background:var(--line); border:1px solid var(--line);}
  .lic-card{background:var(--parchment); padding:30px 28px; display:flex; flex-direction:column; min-height:190px;}
  .lic-card.locked{background:#e6e1d4;}
  .lic-top{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px;}
  .acct-no{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--brass-dark);}
  .badge{
    font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:0.06em; text-transform:uppercase;
    padding:4px 9px; border-radius:2px;
  }
  .badge.active{background:rgba(176,141,87,0.18); color:var(--brass-dark);}
  .badge.locked{background:rgba(122,46,46,0.12); color:var(--lock);}
  .lic-card h3{font-family:'Fraunces',serif; font-weight:500; font-size:19px; color:var(--ink); margin-bottom:8px;}
  .lic-card p{color:var(--text-mute); font-size:14px; flex-grow:1;}
  .lic-cta{
    margin-top:18px; display:inline-flex; align-items:center; gap:8px; font-size:13.5px; font-weight:600;
    padding:11px 18px; border-radius:2px; text-align:center; justify-content:center;
  }
  .lic-cta.open{background:var(--brass); color:var(--ink);}
  .lic-cta.open:hover{background:#c39c66;}
  .lic-cta.request{background:transparent; border:1px solid var(--lock); color:var(--lock);}
  .lic-cta.request:hover{background:rgba(122,46,46,0.06);}

  @media (max-width:760px){
    .lic-grid{grid-template-columns:1fr;}
    .status-card{flex-direction:column; align-items:flex-start;}
  }
</style>
</head>
<body>

<header>
  <nav class="nav">
    <div class="wordmark">GK <span>ADVISORY</span></div>
    <div class="nav-right">
      <span style="color:rgba(237,234,226,0.5); font-size:13px;">Demo Kullanıcı</span>
      <a href="login.html">Çıkış Yap</a>
    </div>
  </nav>
</header>

<section class="panel-hero">
  <div class="wrap">
    <div class="eyebrow">Üye Paneli</div>
    <h1>Hoş geldiniz.</h1>
    <div class="status-card">
      <div class="s-item"><span class="k">Üyelik</span><span class="v">Kurumsal</span></div>
      <div class="s-item"><span class="k">Aktif Lisanslar</span><span class="v brass" id="activeCount">—</span></div>
      <div class="s-item"><span class="k">Yenileme</span><span class="v">31 Ara 2026</span></div>
      <a href="mailto:gorkemkaraagac1@gmail.com" class="lic-cta open" style="margin-top:0;">Lisans Ekle</a>
    </div>
  </div>
</section>

<section class="section">
  <div class="wrap">
    <div class="section-tag">Hizmetlerim</div>
    <h2>Lisansınıza tanımlı araçlar burada açılır.</h2>
    <div class="lic-grid" id="licGrid"></div>
  </div>
</section>

<script>
  // Mock veri — Supabase bağlandığında bu dizi, üyenin veritabanındaki
  // gerçek lisans kayıtlarından (örn. licenses tablosu, RLS ile korunur) gelecek.
  const licenses = [
    { id:'sap',    acct:'HESAP 100', title:'SAP S/4HANA FI-CO Danışmanlığı',       desc:'Paralel defter ve süreç danışmanlığı erişimi.', active:true },
    { id:'tfrs16', acct:'HESAP 700', title:'TFRS 16 Kiralama İşlemleri Yazılımı',   desc:'Kiralama sözleşmelerinin TFRS 16 uyumlu hesaplanması.', active:true },
    { id:'hedge',  acct:'HESAP 800', title:'Hedge Accounting Modülü',              desc:'Nakit akış riskinden korunma muhasebesi ve etkinlik testi.', active:false },
    { id:'dcf',    acct:'HESAP 900', title:'DCF Değerleme Aracı',                  desc:'İndirgenmiş nakit akışı bazlı şirket değerlemesi.', active:true }
  ];

  document.getElementById('activeCount').textContent =
    licenses.filter(l => l.active).length + ' / ' + licenses.length;

  document.getElementById('licGrid').innerHTML = licenses.map(l => `
    <div class="lic-card ${l.active ? '' : 'locked'}">
      <div class="lic-top">
        <span class="acct-no">${l.acct}</span>
        <span class="badge ${l.active ? 'active' : 'locked'}">${l.active ? 'Aktif' : 'Kilitli'}</span>
      </div>
      <h3>${l.title}</h3>
      <p>${l.desc}</p>
      ${l.active
        ? `<a href="tool.html?service=${l.id}" class="lic-cta open">Aracı Aç</a>`
        : `<a href="mailto:gorkemkaraagac1@gmail.com?subject=Lisans Talebi: ${encodeURIComponent(l.title)}" class="lic-cta request">Lisans Talep Et</a>`}
    </div>`).join('');
</script>

</body>
</html>
