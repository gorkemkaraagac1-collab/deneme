<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Lead Pipeline — GK Advisory</title><link rel="stylesheet" href="styles.css"><style>body{background:var(--paper)}.page{padding:80px 0}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.table{width:100%;border-collapse:collapse;background:var(--parchment);border:1px solid var(--line)}th,td{text-align:left;padding:13px;border-bottom:1px solid var(--line);font-size:13px}th{font-family:'JetBrains Mono';font-size:10px;text-transform:uppercase;color:var(--brass-dark)}.badge{font-family:'JetBrains Mono';font-size:10px;padding:4px 7px;border:1px solid var(--line)}.empty{padding:30px;text-align:center;color:var(--text-mute)}@media(max-width:760px){.table{display:block;overflow:auto;white-space:nowrap}}</style></head><body><main class="page"><div class="wrap"><div class="top"><div><div class="section-tag">Commercial Pipeline</div><h1 class="serif">Lead Yönetimi</h1></div><a href="index.html" class="btn-ghost" style="color:var(--ink);border-color:var(--line)">Siteye Dön</a></div><div id="root"></div></div></main><script>const root=document.getElementById('root');const leads=JSON.parse(localStorage.getItem('gk_leads')||'[]');if(!leads.length){root.innerHTML='<div class="empty">Henüz lead bulunmuyor.</div>'}else{root.innerHTML='<table class="table"><thead><tr><th>Tarih</th><th>Lead</th><th>Şirket</th><th>Hizmet</th><th>Skor</th><th>Durum</th></tr></thead><tbody>'+leads.map(l=>`<tr><td>${new Date(l.createdAt).toLocaleString('tr-TR')}</td><td>${l.name}<br><small>${l.email}</small></td><td>${l.company}</td><td>${l.service||'-'}</td><td><span class="badge">${l.score}</span></td><td><span class="badge">${l.status}</span></td></tr>`).join('')+'</tbody></table>'}</script></body></html>
