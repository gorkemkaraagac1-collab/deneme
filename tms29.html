<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GK ADVISORY - TMS 29 Enflasyon Muhasebesi</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="gk-header">
    <div class="gk-header-container">
      <div class="gk-brand">
        <span class="brand-logo">GK</span>
        <span class="brand-title">ADVISORY</span>
      </div>
      <nav class="gk-nav">
        <a href="dashboard.html" class="nav-link">← Panele Dön</a>
      </nav>
    </div>
  </header>

  <main class="main-container">
    <div class="page-header">
      <div class="kpi-title">FINANCE INTELLIGENCE · TMS 29 / TAS 29</div>
      <h1>TMS 29 Enflasyon Muhasebesi</h1>
      <p>Yüksek enflasyonlu ekonomilerde finansal tabloların düzeltilmesi ve net parasal pozisyon kazanç/kayıp hesaplayıcı.</p>
    </div>

    <div class="kpi-card">
      <h3 class="serif-title" style="font-size: 1.2rem; color: var(--gk-navy); margin-bottom: 16px;">1 · Enflasyon Düzeltme Parametreleri</h3>
      <form id="tms29-form" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px;">
        <div>
          <label class="kpi-title">BAŞLANGIÇ Yİ-ÜFE EN DEKSİ</label>
          <input type="number" id="start-index" placeholder="Örn. 1000.00" style="width: 100%; padding: 10px; border: 1px solid var(--card-border); background: #fff; border-radius: 4px; margin-top: 4px;">
        </div>
        <div>
          <label class="kpi-title">BİTİŞ Yİ-ÜFE ENDEKSİ</label>
          <input type="number" id="end-index" placeholder="Örn. 2800.00" style="width: 100%; padding: 10px; border: 1px solid var(--card-border); background: #fff; border-radius: 4px; margin-top: 4px;">
        </div>
        <div>
          <label class="kpi-title">PARASAL OLMAYAN VARLIK TUTARI</label>
          <input type="number" id="asset-amount" placeholder="Örn. 1000000" style="width: 100%; padding: 10px; border: 1px solid var(--card-border); background: #fff; border-radius: 4px; margin-top: 4px;">
        </div>
      </form>
    </div>
  </main>

  <script src="js/financial-data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
